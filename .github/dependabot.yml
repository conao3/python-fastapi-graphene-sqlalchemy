version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /docker/postgres
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
